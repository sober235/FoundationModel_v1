# PILOT PLAN (2026-11-12). A controlled 6000-step trial of one change to the unified plan unified_knee_brain_v1
# (configs/v5/proposals/unified_knee_brain.yaml, sha256 2f43a971...): the negative term of the knee box objective
# keeps, per class, only the top 1 % of the eligible negative voxels of a batch (negative_topk_fraction: 0.01).
# Approved by the researcher on 2026-11-12 (option B of reports/v5/unified_diagnostics_20261112.md, section 11).
# The 1 % is a first engineering setting of this trial, not a value known to work.
# Everything else equals the finished run: seeds, model, optimiser, schedule, precision, frozen splits (scope,
# source, lineage), sampling, positive term (topk_fraction 0.1), both weights, supervision masks, acceptance and
# metric policies. tests/v5/test_unified_registration.py lists the four differing values.
# shared.stop_at_step ends the run after step 6000; shared.budget.max_steps stays 30000, so the learning rate
# follows the first 6000 steps of the 30000-step decay of the finished run. Checkpoints at 2000, 4000 and 6000.
# budget.max_wall_hours 16 is the cap of the whole trial (smoke, probes, training, evaluations of both
# checkpoints). Nothing runs on real data before the resources approvals name this file's plan sha256
# (python -m anatobind.v41.real_unified_v5 plan-hash). Comments are not part of the hash.
plan_id: unified_knee_brain_negtopk_pilot_v1
shared:
  model:
    architecture: resunet3d
    widths: [32, 64, 128, 256, 320]
    strides: [[1, 1, 1], [2, 2, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
    blocks_per_stage: 2
    stem_channels: 16
  seeds: {init: 20261110, sampler: 20261111}
  optimizer: {name: adamw, lr: 0.001, weight_decay: 0.0001}
  scheduler: {name: poly, exponent: 0.9}
  precision: fp32
  selection_rule: last
  checkpoint_every: 2000
  # The schedule of the finished run, unchanged: the learning rate decays over 30000 steps.
  budget: {max_steps: 30000, max_wall_hours: 16.0}
  # This trial stops after step 6000 of that schedule (a checkpoint is written there).
  stop_at_step: 6000
members:
  knee_qdess:
    scope_id: skm_joint_early
    scope_hash: f6e4b5f6e3c95a49f5f8cb45591b2a2c437b8db2d432551e1bd1e9e81935ec9f
    source: {source_id: skm_tea_joint_early, source_version: skm_tea_annotations_v1.0.0}
    lineage_id: v51_skm_joint_early
    tasks: [A, U]
    patch_size: [192, 192, 48]
    batch_size: 2
    downsample_factor: [1, 1, 1]
    grid_tolerance: {atol_affine: 0.001, atol_spacing: 0.001}
    normalization: zscore_volume
    sampling: {positive_fraction: 0.5}
    inference: {window: [192, 192, 48], stride: [96, 96, 24]}
    loss_weight: 1.0
    supervision:
      policy_id: skm_joint_early_supervision_v1
      scope_id: skm_joint_early
      reference_policy_id: skm_box_reference_v1
      track: released_reference
      allow_unknown_visibility: false
      channel: expert
      tasks:
        A: {kind: softmax, ce_weight: 1.0, dice_weight: 1.0, task_weight: 1.0}
        U: {kind: sigmoid, ce_weight: 1.0, dice_weight: 1.0, task_weight: 1.0}   # weights unused: box_supervision replaces the U loss
    box_supervision:
      kind: box_mil
      topk_fraction: 0.1
      positive_weight: 1.0
      negative_weight: 1.0
      # per class: the ceil(0.01 * N) highest of the N eligible negative voxels (e_neg) pooled over the batch
      negative_topk_fraction: 0.01
      box_policy_sha256: 09b1003e63fb5e8517be7626ba7e522dba9a7397a53dcd4ef910226bc734f2a9
    acceptance_policy:
      policy_id: skm_joint_early_engineering_v1
      policy_role: engineering
      anatomy: {min_confidence: 0.0}
      abnormality:
        thresholds: {cartilage_lesion: 0.5, meniscal_tear: 0.5}
        reject_band: {cartilage_lesion: none, meniscal_tear: none}
      # min_voxels 50 (2026-11-10, after the failed first smoke): a positive component under 50 voxels (about
      # 4 mm^3 on the qDESS grid) is not reported as a finding. The smallest primary box of the train readers is
      # 144 voxels. With 1, a 40-step model gave about 210,000 components per scan; with 50, about 290.
      instances: {connectivity: 26, min_voxels: 50}
    metric_policy: {metrics: [dice], surface_tolerance_mm: null, iou_match_threshold: null, fp_budget_per_scan: null, class_aware: null, size_strata_voxels: null}
    finding_policy: {host: majority_accepted_anatomy, iobb_thresholds: [0.1, 0.25, 0.5]}
  brain_dwi_adc:
    scope_id: isles_u
    scope_hash: 0ddcfb0347a2fd0a126393a4dc0f5227f4d3f2e58aab4e36b6d88f5074c5e5fb
    source: {source_id: isles_2022, source_version: isles2022_bids1.6.0}
    lineage_id: v51_isles_u_b2
    tasks: [U]
    patch_size: [112, 112, 64]
    batch_size: 2
    downsample_factor: [1, 1, 1]
    grid_tolerance: {atol_affine: 0.001, atol_spacing: 0.001}
    normalization: zscore_volume
    sampling: {positive_fraction: 0.67}
    inference: {window: [112, 112, 64], stride: [56, 56, 32]}
    loss_weight: 1.0
    supervision:
      policy_id: isles_u_supervision_v1
      scope_id: isles_u
      reference_policy_id: isles_released_reference_v1
      track: released_reference
      allow_unknown_visibility: true
      channel: expert
      tasks:
        U: {kind: sigmoid, ce_weight: 1.0, dice_weight: 1.0, task_weight: 1.0}
    box_supervision: null
    acceptance_policy:
      policy_id: isles_u_engineering_v1
      policy_role: engineering
      anatomy: {min_confidence: null}
      abnormality:
        thresholds: {ischemic_infarct: 0.5}
        reject_band: {ischemic_infarct: none}
      instances: {connectivity: 26, min_voxels: 1}
    metric_policy: {metrics: [dice, hd95, nsd, lesion_detection], surface_tolerance_mm: 2.0, iou_match_threshold: 0.1, fp_budget_per_scan: null, class_aware: true, size_strata_voxels: [10, 100, 1000]}
    finding_policy: {host: none, iobb_thresholds: null}
smoke:
  steps: 40
  pause_at: 20
  checkpoint_every: 20
  subset_count: {knee_qdess: 2, brain_dwi_adc: 2}
  subset_salt: v51-smoke-unified-20261110
  tolerances: {loss_atol: 0.0001, loss_rtol: 0.001, param_rtol: 0.001}
  max_wall_hours: 2.0
budget: {max_wall_hours: 16.0}
