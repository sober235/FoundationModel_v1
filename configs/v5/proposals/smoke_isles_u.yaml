# PROPOSAL — NOT APPROVED (2026-11-09). Smoke plan for isles_u (ISLES-2022 DWI/ADC, U-only), plan_v5 §2C T10 step 2.
# Every value below is a proposal for the researcher. The smoke runs only after the researcher signs a
# `resources` approval for isles_u that names this file's plan sha256 (python -m anatobind.v41.real_t10_v5 plan-hash).
# Any edit changes the hash and needs a new approval. Comments are not part of the hash.
plan_id: smoke_isles_u_v1
scope_id: isles_u
scope_hash: 0ddcfb0347a2fd0a126393a4dc0f5227f4d3f2e58aab4e36b6d88f5074c5e5fb
source: {source_id: isles_2022, source_version: isles2022_bids1.6.0}
lineage_id: v51_isles_u_b2            # the frozen T08 split's lineage
recipe:                               # patch_size, batch_size and precision come from the chosen candidate
  recipe_id: isles_u_smoke_v1
  model:
    architecture: resunet3d
    tasks: [U]
    widths: [32, 64, 128, 256, 320]
    strides: [[1, 1, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 1]]   # x16, y16, z8 in total
    blocks_per_stage: 2
  seeds: {init: 20261109, sampler: 20261110}
  optimizer: {name: adamw, lr: 0.001, weight_decay: 0.0001}
  scheduler: {name: poly, exponent: 0.9}
  downsample_factor: [1, 1, 1]        # T07 loss check: 2x2x2 loses 846 lesion components in 147 scans
  grid_tolerance: {atol_affine: 0.001, atol_spacing: 0.001}
  normalization: zscore_volume
  sampling: {positive_fraction: 0.67}
  readable_roles: [train]
  selection_rule: last
  inference: {window: [112, 112, 64], stride: [56, 56, 32]}
  checkpoint_every: 100
  budget: {max_steps: 500, max_wall_hours: 0.5}
supervision:
  policy_id: isles_u_supervision_v1
  scope_id: isles_u
  reference_policy_id: isles_released_reference_v1
  track: released_reference           # learn the released masks; input_visibility stays unknown (not visible)
  allow_unknown_visibility: true
  channel: expert
  tasks:
    U: {kind: sigmoid, ce_weight: 1.0, dice_weight: 1.0, task_weight: 1.0}
acceptance_policy:
  policy_id: isles_u_engineering_v1
  policy_role: engineering            # never a formal threshold (Proposal §9)
  anatomy: {min_confidence: null}
  abnormality:
    thresholds: {ischemic_infarct: 0.5}
    reject_band: {ischemic_infarct: none}
  instances: {connectivity: 26, min_voxels: 1}
candidates:                           # preference order; the first OK one within the memory cap is used
  - {patch_size: [112, 112, 64], batch_size: 2, precision: fp32}
  - {patch_size: [112, 112, 64], batch_size: 2, precision: amp_bf16}
  - {patch_size: [128, 128, 64], batch_size: 2, precision: amp_bf16}
  - {patch_size: [112, 112, 64], batch_size: 4, precision: amp_bf16}
candidate_rule: {name: first_ok_within_memory, max_memory_fraction: 0.5}   # shared GPUs: at most half of one card
subset: {salt: v51-smoke-isles_u-20261109, count: 2, strata: [volume_t2]}  # middle lesion-volume tertile, train only
overfit:
  criteria: {min_loss_drop: 0.5, min_dice: 0.5, loss_window: 20}
resume:
  pause_at: 300
  tolerances: {loss_atol: 0.0001, loss_rtol: 0.001, param_rtol: 0.001}
  deterministic: true
budget: {max_wall_hours: 2.0}
