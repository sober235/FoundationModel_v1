# v5.1 source policies TEMPLATE (Proposal_v5 §3.1-3.2; plan_v5.md T07a).
# Keys are source_id. annotation_modalities, index_evidence, physical_units_policy and
# physical_units_evidence stay null until the T07c read-only check on the data server provides
# evidence; until then migrating real records fails closed (ANNOTATION_MODALITY_UNKNOWN), and
# geometry is never marked verified. A units policy without its evidence is rejected.
# source_release is the release string the v41 records of this source carry; migration refuses
# records with any other string (plan_v5.md §1.6 L1). Values read from the real v41 records.
isles_2022:
  source_version: isles2022_bids1.6.0
  source_release: ISLES-2022
