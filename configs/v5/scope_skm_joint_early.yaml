# ActiveScope v5.1: early-phase SKM-TEA joint scenario (Proposal_v5 §2.2 `skm_joint_early`, §5.0; plan_v5 T11).
# Proposed 2026-11-09, approved by the researcher 2026-11-10 (reports/v5/status.md D3). Classes and rules follow
# S1–S7 (adopted 2026-11-07) as encoded in configs/v5/skm_box_policy_v1.yaml, whose policy_id is this scope's
# reference policy.
# completion_role is auxiliary_spatial on purpose: box-level U and tissue-level R from released labels can never
# complete the core host binding, so G-JOINT stays blocked (CORE_RELATION_REQUIRED) and core_target_validated
# stays null; results go to early_phase_status only. Approving the scope is not a G-DATA approval: this scope
# needs its own G-DATA evidence and data_use sign-off; skm_a's do not carry over.
schema_version: "v5.1"
scope_id: skm_joint_early
scope_kind: joint
anatomy_classes: [patellar_cartilage, femoral_cartilage, tibial_cartilage_medial, tibial_cartilage_lateral, meniscus_medial, meniscus_lateral]
state_anatomy_classes: [patellar_cartilage, femoral_cartilage, tibial_cartilage_medial, tibial_cartilage_lateral, meniscus_medial, meniscus_lateral]
abnormality_classes: [cartilage_lesion, meniscal_tear]      # S1 primary; grade 1 is a secondary analysis (S2)
relation_type: host_tissue
relation_predicate: located_in_tissue_group
relation_contract:
  target_question: "Which of the four tissue groups (femoral, patellar, tibial cartilage, meniscus) hosts each released abnormality box?"
  predicate: located_in_tissue_group
  reference_method: released_tissue_id_by_release_name_table
  display_name: "Host tissue group (released tissue_id)"
  completion_role: auxiliary_spatial
input_modalities: [qdess_e1, qdess_e2]
observation_mode: "3d"
normal_claim_scope: no_negative_claim_unrecorded_is_annotation_unknown
reference_policy_id: skm_box_reference_v1
